<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Clientes — DDS</title>
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet">
</head>
<body class="bg-light">

<div class="container py-5">

  <div class="d-flex justify-content-between align-items-center mb-4">
    <h1 class="h3 mb-0">🧑‍💼 Clientes</h1>
    <!-- TODO 5.1: en el onclick de este botón, llamar a cargarClientes() -->
    <button class="btn btn-primary" onclick="cargarClientes()">🔄 Actualizar</button>

  </div>

  <div id="alerta" class="alert alert-danger d-none" role="alert"></div>

  <div class="card shadow-sm">
    <div class="card-body p-0">
      <table class="table table-hover mb-0">
        <thead class="table-dark">
          <tr>
            <th>ID</th><th>Nombre</th><th>Email</th><th>Ciudad</th>
          </tr>
        </thead>
        <tbody id="cuerpo">
          <tr><td colspan="4" class="text-center text-muted py-4">Cargando...</td></tr>
        </tbody>
      </table>
    </div>
  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script>
  const API_URL = 'http://localhost:3000/api/clientes';

  // ── Función implementada — NO modificar ──────────────────────
  async function cargarClientes() {
    const alerta = document.getElementById('alerta');
    const tbody  = document.getElementById('cuerpo');
    alerta.classList.add('d-none');
    tbody.innerHTML =
      '<tr><td colspan="4" class="text-center text-muted py-3">Cargando...</td></tr>';
    try {
      const res      = await fetch(API_URL);
      if (!res.ok) throw new Error(`Error ${res.status}`);
      const clientes = await res.json();
      tbody.innerHTML = clientes.map(c => `
        <tr>
          <td>${c.id}</td>
          <td>${c.nombre}</td>
          <td>${c.email}</td>
          <td>${c.ciudad || '—'}</td>
        </tr>`).join('');
    } catch (err) {
      alerta.textContent = '❌ No se pudo conectar con la API. ¿Está corriendo el servidor?';
      alerta.classList.remove('d-none');
      tbody.innerHTML = '';
    }
  }

  document.addEventListener('DOMContentLoaded', () => {
    cargarClientes();
  });


</script>

</body>
</html>
